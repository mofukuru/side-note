name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the workflow be started by hand from the Actions tab, which matters on a fork where
  # the very first run has to be enabled manually.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src --ext .ts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
